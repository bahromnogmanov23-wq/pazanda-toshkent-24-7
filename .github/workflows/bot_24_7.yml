name: Pazanda va Toshkent 24-7 Autobot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-news-and-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyTelegramBotAPI requests "yt-dlp[default]"

      - name: Run Pazanda Maxorati video aggregator cycle
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python pazanda_avto.py --once

      - name: Run Toshkent 2200 aggregator cycle
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python yangiliklar.py --once

      - name: Save seen state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json || true
          git diff --staged --quiet || (git commit -m "chore: update seen database [skip ci]" && git push)
